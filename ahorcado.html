<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Grupo Urano</title>
<style>
    body { font-family: sans-serif; text-align: center; background: #eef; }
    .juego { margin: 2rem auto; }
    canvas { background: #fff; border: 2px solid #000; margin: 1rem 0; }
    button { margin: 0.5rem; padding: 0.5rem 1rem; }
</style>
</head>
<body>
<h1>Ahorcado de Marie Curie</h1>

    <p>Adivina las 5 palabras ocultas</p>
    <canvas id="canvas" width="200" height="250"></canvas><br>
    <input id="letra" maxlength="1" />
    <button onclick="jugar()">Intentar letra</button>
    <p id="palabra"></p>
    <p id="pistas"></p>
    <p id="mensaje"></p>


<script>
    const niveles = ['anemia', 'polonio', 'polonia', 'piere', 'radio'];
    const pistas = ['primera pista', 'segunda', 'tercera', 'cuarta', 'quinta' ]
    let nivel = 0;
    let palabra = niveles[nivel];
    let pista = pistas[nivel]
    let estado = '_'.repeat(palabra.length).split('');
    let errores = 0;
    document.getElementById("pistas").innerText = pista
    document.getElementById("palabra").innerText = estado.join(' ');

    function jugar() {
    const entrada = document.getElementById("letra");
    const letra = entrada.value.toLowerCase();
    entrada.value = '';
    if (!letra || errores >= 5 || estado.join('') === palabra) return;

    if (palabra.includes(letra)) {
        palabra.split('').forEach((l, i) => {
        if (l === letra) estado[i] = letra;
        });
    } else {
        errores++;
        dibujar();
    }
    document.getElementById("palabra").innerText = estado.join(' ');
    if (estado.join('') === palabra) {
        document.getElementById("mensaje").innerText = "¡Bien hecho! Pasamos a la siguiente palabra.";
        setTimeout(() => {
        errores = 0;
        nivel++;
        pista = pistas[nivel]
            document.getElementById("pistas").innerText
        if (nivel < niveles.length) {
            palabra = niveles[nivel];
            estado = '_'.repeat(palabra.length).split('');
            document.getElementById("palabra").innerText = estado.join(' ');
            document.getElementById("mensaje").innerText = "";
            limpiarCanvas();
        } else {
            document.getElementById("mensaje").innerText = "🎉 ¡Completaste todos los niveles!";
        }
        }, 1000);
    }
    }

    const ctx = document.getElementById("canvas").getContext("2d");
    function dibujar() {
    if (errores === 1) {
        ctx.fillRect(10, 230, 100, 5);
    ctx.fillRect(50, 10, 5, 220);
        ctx.fillRect(50, 10, 60, 5);
        ctx.fillRect(110, 10, 5, 20)
        ctx.beginPath();
        ctx.arc(112, 40, 10, 0, Math.PI * 2);
        ctx.stroke();
    }
    if (errores === 2){
        ctx.beginPath();
ctx.moveTo(112, 50);  // cuello
ctx.lineTo(112, 100); // tronco
ctx.stroke();
    }
    if (errores === 3) {
        ctx.beginPath();
ctx.moveTo(112, 60);
ctx.lineTo(92, 80);
ctx.stroke();

// --- Brazo derecho ---
ctx.beginPath();
ctx.moveTo(112, 60);
ctx.lineTo(132, 80);
ctx.stroke();
    }
    if (errores === 4) {
        ctx.beginPath();
ctx.moveTo(112, 100);
ctx.lineTo(95, 130);
ctx.stroke();

// --- Pierna derecha ---
ctx.beginPath();
ctx.moveTo(112, 100);
ctx.lineTo(129, 130);
ctx.stroke();
    }
    if (errores === 5) {
        ctx.beginPath();
    ctx.moveTo(102, 47);  // lado izquierdo del cuello
    ctx.lineTo(122, 47);  // lado derecho del cuello
    ctx.strokeStyle = "black";
    ctx.lineWidth = 2;
    ctx.stroke();
        document.getElementById("mensaje").innerText = "Perdiste🙁🙁";
    }
    }

    function limpiarCanvas() {
    ctx.clearRect(0, 0, 200, 250);
    }
</script>
</body>
</html>
